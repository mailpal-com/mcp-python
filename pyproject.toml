[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailpal-mcp"
version = "2.0.0"
description = "MCP server for MailPal -- free email for AI agents with hardware attestation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "Crypt Inc.", email = "admin@mailpal.com" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "email",
  "ai-agent",
  "smtp",
  "imap",
  "jmap",
  "attestation",
  "mailpal",
  "1id",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]
dependencies = [
  "mcp>=1.27.0,<2",  # mcp 2.x renamed FastMCP (breaks `from mcp.server.fastmcp import FastMCP`)
  # httpx stays here (async SSE/REST); floor httpcore because <1.0.9
  # breaks HTTPS (same end-user-install exposure the oneid SDK had
  # before it went stdlib-only in 1.5.0).
  "httpx>=0.27.0",
  "httpcore>=1.0.9",
  "oneid>=4.0.0",  # 4.0.0: REG-03 TPM ceremony + draft -03 email attestation; 3.x cannot enroll a TPM at the live Registrar
]

[project.scripts]
mailpal-mcp = "mailpal_mcp.server:main"

[project.urls]
Homepage = "https://mailpal.com"
Repository = "https://github.com/mailpal-com/mcp-python"
Issues = "https://github.com/mailpal-com/mcp-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mailpal_mcp"]
